services:
  frontend:
    build:
      context: .
      target: development-dependencies-env

    container_name: brasil-terrenos-frontend

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - /app/node_modules

    working_dir: /app

    command: npm run dev -- --host 0.0.0.0

    restart: unless-stopped